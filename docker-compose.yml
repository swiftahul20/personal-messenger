services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_DB: messenger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    environment:
      DATABASE_URL: postgres://messenger:messenger@db:5432/messenger?sslmode=disable
      ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_TARGET: http://server:8080
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      server:
        condition: service_started

volumes:
  postgres_data:
  web_node_modules:
